name: tests
on:
  push:
  pull_request:
  # The app API, its credential and its param sets are reverse-engineered,
  # so a daily live run is what notices Kleinanzeigen changing them.
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run the offline suite
        run: pytest -q

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run the live smoke tests
        run: pytest -q tests/test_live.py
        env:
          KLEINANZEIGEN_LIVE: "1"
