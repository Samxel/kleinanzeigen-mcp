name: Bug report
description: Something in the MCP server is broken
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please fill in what you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: Called search_kleinanzeigen(query="fahrrad", ...) and got ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search (search_kleinanzeigen)
        - Ad detail / images
        - Seller info
        - Categories
        - Auth / client id
        - Other or not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server output / error
      description: Paste the relevant traceback or MCP error. It is rendered as code.
      render: shell
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Desktop, ...
